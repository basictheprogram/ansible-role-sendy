galaxy_info:
  namespace: realtime
  role_name: sendy
  author: "Bob Tanner"
  company: "Real Time Enterprises, Inc."
  description: >-
    Automates upgrading a self-hosted Sendy email marketing installation
    for Debian (bookworm, trixie) and Ubuntu (jammy, noble, resolute):
    backs up config.php, locale, and .htaccess, stages the new build,
    applies HelloSendy's four-rule preservation procedure, and syncs it
    into production with an optional smoke test.
